name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: check
        run: scripts/check.sh
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/qgate
