name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: check
        run: scripts/check.sh
      - name: build
        run: CGO_ENABLED=0 go build ./cmd/qgate

  # qgate gates its own changes, configured in .qgate.yaml.
  self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base commit must be present for the diff
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build qgate
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/qgate" ./cmd/qgate
      - name: lint, test and coverage reports
        run: |
          mkdir -p reports
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run \
            --output.sarif.path=reports/golangci.sarif ./... || true
          go test -v -coverpkg=./... -coverprofile=reports/cover.out ./... > reports/test.txt 2>&1 || true
          go run github.com/boumenot/gocover-cobertura@v1.5.0 < reports/cover.out > reports/coverage.xml
          go run github.com/jstemmer/go-junit-report/v2@v2.1.0 -in reports/test.txt > reports/junit.xml
      - name: qgate run
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Until qgate detects CI context itself (ticket 12): a pull
          # request compares with its base, a push with the previous tip;
          # a new branch (all-zero "before") with its parent commit.
          base=$EVENT_BASE
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD~1)
          fi
          set +e
          "$RUNNER_TEMP/qgate" run --stage ci --base "$base" \
            --output json=qgate-report.json --output markdown=reports/summary.md --output sarif=reports/qgate.sarif
          code=$?
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qgate-report
          path: |
            qgate-report.json
            reports/
